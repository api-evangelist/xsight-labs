aid: xsight-labs
name: Xsight Labs
description: Xsight Labs is a fabless semiconductor company redefining AI and cloud
  connectivity with end-to-end, software-defined silicon for hyperscale data centers.
  Its X-Series programmable Ethernet switch silicon (X1, X2) delivers 3.2-12.8 Tbps
  with sub-700ns latency and is programmable through XISA, the first fully open,
  documented switch instruction set architecture, published under MPLv2. Its E-Series
  is billed as the industry's first fully software-defined 800G DPU family, placing
  64 Arm Neoverse N2 cores directly in the data path and programmable with standard
  Linux tooling (XDP, DPDK, SPDK) with no proprietary SDK. Xsight Labs contributes
  SONiC platform code and a SAI implementation through its public GitHub organization.
  Backed by Battery Ventures among other investors. The company publishes technical
  documentation, XISA specifications, and programming examples rather than a hosted
  web API; no public OpenAPI, REST endpoints, or hosted API surface were found during
  enrichment.
